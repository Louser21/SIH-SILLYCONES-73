version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: sih_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: sih_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    env_file:
      - .env.example
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mqtt:
    image: eclipse-mosquitto:2
    container_name: sih_mqtt
    ports:
      - "1883:1883"
